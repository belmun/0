<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hallpass</title><style>:root{--bg:#eef0ff;--card:#fff;--ink:#1b1b3a;--mute:#6b6b8f;--acc:#ff4f6d;--acc2:#2ec4b6;--line:#dcdff5}
@media(prefers-color-scheme:dark){:root{--bg:#12122a;--card:#1c1c3c;--ink:#f0f0ff;--mute:#9a9ac0;--line:#2e2e57}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Trebuchet MS",system-ui,sans-serif;padding:env(safe-area-inset-top) 0 0}
#app{display:grid;grid-template-columns:220px minmax(0,640px) 1fr;min-height:100vh;gap:0}
nav{position:sticky;top:0;height:100vh;padding:20px 14px;display:flex;flex-direction:column;gap:4px}
nav h1{margin:0 0 14px;font-size:24px;letter-spacing:-1px}nav h1 span{color:var(--acc)}
nav button{all:unset;cursor:pointer;padding:10px 14px;border-radius:12px;font-weight:700}
nav button.on,nav button:hover{background:var(--card)}nav button:focus-visible,button:focus-visible{outline:2px solid var(--acc)}
main{padding:16px;min-width:0}aside{padding:20px;color:var(--mute);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r,16px);padding:14px;margin-bottom:12px}
.row{display:flex;gap:10px;align-items:flex-start}.av{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--acc2);flex:none;display:grid;place-items:center;color:#fff;font-weight:800}
.big{width:80px;height:80px;font-size:28px}.mute{color:var(--mute);font-size:13px}.grow{flex:1;min-width:0}
input,textarea,select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:inherit;font:inherit;margin:4px 0 10px}
textarea{min-height:90px}label{font-weight:700;font-size:13px}
.btn{background:var(--acc);color:#fff;border:0;border-radius:999px;padding:9px 18px;font-weight:800;cursor:pointer;font:inherit;font-weight:800}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn.sm{padding:5px 12px;font-size:13px}
.msg{max-width:80%;padding:8px 12px;border-radius:16px;margin:4px 0;background:var(--bg)}.msg.me{margin-left:auto;background:var(--acc);color:#fff}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.bar .grow input{margin:0}
.banner{height:90px;border-radius:12px;background:linear-gradient(120deg,var(--acc2),var(--acc));background-size:cover;margin-bottom:8px}
.stats{display:flex;gap:14px;font-size:14px;margin:6px 0 0}.pill{background:var(--bg);border-radius:99px;padding:2px 10px;font-size:12px}
.empty{text-align:center;color:var(--mute);padding:40px 10px}
@media(max-width:860px){#app{grid-template-columns:1fr;padding-bottom:70px}aside{display:none}
nav{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;justify-content:space-around;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:9}
nav h1{display:none}nav button{padding:10px 8px;font-size:13px}}
@media(prefers-reduced-motion:no-preference){.card{animation:in .25s}@keyframes in{from{opacity:0;transform:translateY(6px)}}}
.acts{display:flex;gap:20px;margin-top:8px}.act{all:unset;cursor:pointer;color:var(--mute);font-size:14px;padding:4px 2px}.act.on{color:var(--acc)}.act:focus-visible{outline:2px solid var(--acc)}.thread{height:52vh;overflow-y:auto;padding:12px;display:flex;flex-direction:column}.msg:not(.me){border-bottom-left-radius:4px}.msg.me{border-bottom-right-radius:4px}.msg.typing{opacity:.6;letter-spacing:3px;width:fit-content}.dot{width:10px;height:10px;border-radius:50%;background:var(--acc)}.av.sm{width:28px;height:28px;font-size:12px}@media(max-width:860px){nav{overflow-x:auto}nav button{white-space:nowrap}}.av{cursor:pointer}</style></head>
<body><div id="app"><main style="padding:40px"><b>Loading Hallpass…</b><br>If this stays blank, JavaScript is blocked in this viewer. Open the page in Safari or Chrome.</main></div><script>// Hallpass — a high-school social simulation. Static site; all data in localStorage.
const DBKEY='hallpass.v1';const $=s=>document.querySelector(s);
let db=JSON.parse(localStorage.getItem(DBKEY)||'{"worlds":[]}'),wid=null,tab='feed',dmWith=null,editId=null,grp=null,newGroup=false;
db.worlds.forEach(w=>w.posts.forEach(p=>{p.text=p.text.replace(/ \(iconic, obviously\)/g,'');p.replies.forEach(r=>r.text=r.text.replace(/ \(iconic, obviously\)/g,''))}));
const save=()=>{try{localStorage.setItem(DBKEY,JSON.stringify(db))}catch(e){toast('Storage full: remove some images.')}};
const uid=()=>Math.random().toString(36).slice(2,9);const rnd=a=>a[Math.floor(Math.random()*a.length)];
const W=()=>db.worlds.find(w=>w.id===wid);const C=id=>W().chars.find(c=>c.id===id);

const fmt=n=>n>=1e3?(n/1e3).toFixed(n>=1e4?0:1)+'k':n;

function applyTheme(){const r=document.documentElement.style;['acc','acc2','bg','card','ink'].forEach(k=>THEME[k]?r.setProperty('--'+k,THEME[k]):r.removeProperty('--'+k));
 if(THEME.ink||THEME.bg){r.setProperty('--line','color-mix(in srgb,'+(THEME.ink||'var(--ink)')+' 16%,transparent)');r.setProperty('--mute','color-mix(in srgb,'+(THEME.ink||'var(--ink)')+' 62%,'+(THEME.bg||'var(--bg)')+')')}else{r.removeProperty('--line');r.removeProperty('--mute')}
 THEME.r!=null?r.setProperty('--r',THEME.r+'px'):r.removeProperty('--r');document.body.style.fontFamily=THEME.font||''}
function settingsView(){const t=THEME,col=(k,l)=>`<label>${l}</label><input type="color" data-th="${k}" value="${t[k]||DEF[k]}" style="height:44px;padding:2px">`;

function gReply(w,g,low){g.members.map(C).filter(c=>c&&c.id!==w.meId).sort(()=>Math.random()-.5).slice(0,1+Math.floor(Math.random()*3)).reduce((p,c)=>p.then(()=>gOne(w,g,c,low)),Promise.resolve())}
function gOne(w,g,c,low){if(wid!==w.id||!WE)return Promise.resolve();
 const names=g.members.map(id=>(C(id)||{}).name).filter(Boolean).join(', '),tr=g.msgs.slice(-12).map(x=>((C(x.from)||{}).name||'?')+': '+x.text).join('\n')||'(the group chat was just created)';
 typing['g'+g.id]=c.name;refresh();
 return llm(ctx(c)+` You are in a group chat called "${g.name}" with ${names}. Write only ${c.name}'s next message: one short sentence that reacts naturally to the latest message or moves the conversation on. Do not repeat what others said. Never write for anyone else.`,[{role:'user',content:tr}],60,low,.85)
 .then(clean).then(t=>{if(dup(t,g.msgs.slice(-8).map(x=>x.text)))throw new Error('dup');g.msgs.push({from:c.id,text:t,t:Date.now()});g.msgs=g.msgs.slice(-200)}).catch(()=>{}).finally(()=>{delete typing['g'+g.id];save();refresh()})}

 else w.log.unshift({t:s,when:`Day ${w.day} · ${PERIODS[w.period]}`});save();render()}
// ---- views
function render(restore){const root=$('#app'),keep={},fid=document.activeElement&&document.activeElement.id;
 if(restore)document.querySelectorAll('#app textarea,#app input').forEach(i=>{if(i.id&&i.type!=='file'&&i.type!=='range')keep[i.id]=i.value});
 if(!wid){root.innerHTML=`<main style="grid-column:1/-1;max-width:640px;margin:auto"><h1>Hallpass <small class="mute">v2</small></h1>${db.worlds.map(w=>`<div class="card row"><div class="grow"><b>${esc(w.name)}</b><div class="mute">${esc(w.school.name)} · ${w.chars.length} people</div></div><button class="btn sm" data-a="open" data-id="${w.id}">Continue</button><button class="btn sm alt" data-a="ren" data-id="${w.id}">Rename</button><button class="btn sm alt" data-a="dup" data-id="${w.id}">Duplicate</button><button class="btn sm alt" data-a="del" data-id="${w.id}">Delete</button></div>`).join('')||'<div class="empty">No worlds yet. Create your first school.</div>'}<button class="btn" data-a="new">Create world</button></main>`;return}
 const w=W(),tabs=[['feed','Feed'],['dm','Chats'],['alerts','Alerts'],['cast','Cast'],['school','School'],['search','Search'],['settings','Settings']];
 root.innerHTML=`<nav><h1>hall<span>pass</span> <small class="mute">v2</small></h1>${tabs.map(([k,l])=>`<button class="${tab===k?'on':''}" data-tab="${k}">${l}${k==='dm'&&w.chars.some(c=>c.unread)?' •':''}</button>`).join('')}<button data-a="home">Worlds</button></nav><main>${WSTATE&&!WHIDE?`<div class="card mute row" style="align-items:center"><span id="wbar" class="grow">${esc(WSTATE)}</span><button class="act" data-a="wdismiss">✕</button></div>`:''}${view()}</main><aside><b>${esc(w.school.name)}</b><br>Day ${w.day} · ${PERIODS[w.period]}<br><span class="mute">The world updates live.</span></aside>`;
 Object.keys(keep).forEach(k=>{const e=document.getElementById(k);if(e)e.value=keep[k]});
 if(fid){const e=document.getElementById(fid);if(e&&e.focus)e.focus()}
 const th=$('.thread');if(th)th.scrollTop=th.scrollHeight;const s=$('#q');if(s&&tab==='search'&&!restore)s.focus()}
function postHTML(p){const c=C(p.by);if(!c)return'';
 return`<div class="card"><div class="row">${av(c)}<div class="grow"><b>${esc(c.name)}</b> <span class="mute">@${esc(c.user)}</span><div>${esc(p.text)}</div><div class="acts"><button class="act" data-a="reply" data-id="${p.id}">💬 ${p.replies.length}</button><button class="act ${p.rt?'on':''}" data-a="rt" data-id="${p.id}">↻ ${fmt(p.reposts)}</button><button class="act ${p.lk?'on':''}" data-a="like" data-id="${p.id}">${p.lk?'♥':'♡'} ${fmt(p.likes)}</button></div>${p.replies.map(r=>{const rc=C(r.by);return rc?`<div class="row" style="margin-top:8px">${av(rc)}<div class="grow"><b>${esc(rc.name)}</b> <span class="mute">${esc(r.text)}</span></div></div>`:''}).join('')}${replyTo===p.id?`<div class="row" style="margin-top:8px"><input id="rin" placeholder="Reply…" style="margin:0"><button class="btn sm" data-a="rsend" data-id="${p.id}">Reply</button></div>`:''}</div></div></div>`}
function view(){const w=W(),m=me();
 if(tab==='feed')return`<div class="card"><div class="row">${av(m)}<div class="grow"><textarea id="cmd" placeholder="What's happening?"></textarea><button class="btn sm" data-a="post">Post</button> <button class="btn sm alt" data-a="do">Log an action</button> <button class="btn sm alt" data-a="evnew">✨ Event</button></div></div></div>${w.log.slice(0,2).map(l=>`<div class="card mute">${esc(m.name)}: ${esc(l.t)}<br>${l.when}</div>`).join('')}${w.posts.map(postHTML).join('')||'<div class="empty">Quiet so far. Post something or wait a few seconds.</div>'}`;
 if(tab==='dm'){if(newGroup)return groupForm();const gg=grp&&(w.groups||[]).find(x=>x.id===grp);if(gg)return groupThread(gg);const cur=dmWith&&C(dmWith);
  if(!cur)return '<button class="btn sm" data-a="gnew">+ New group chat</button><br><br>'+(w.groups||[]).map(g=>`<div class="card row" data-grp="${g.id}" style="cursor:pointer;align-items:center"><div class="av">#</div><div class="grow"><b>${esc(g.name)}</b><div class="mute">${esc(g.msgs.length?g.msgs[g.msgs.length-1].text:g.members.length+' members')}</div></div></div>`).join('')+w.chars.filter(c=>c.id!==m.id).map(c=>{const d=w.dms[c.id]||[],l=d[d.length-1];return`<div class="card row" data-dm="${c.id}" style="cursor:pointer;align-items:center">${av(c)}<div class="grow"><b>${esc(c.name)}</b><div class="mute">${l?esc((l.from===m.id?'You: ':'')+l.text):'Tap to message'}</div></div>${c.unread?'<span class="dot"></span>':''}</div>`}).join('')||'<div class="empty">Add characters in Cast first.</div>';
  return`<div class="card" style="padding:0"><div class="row" style="padding:12px;border-bottom:1px solid var(--line);align-items:center"><button class="btn sm alt" data-a="dmback">←</button>${av(cur)}<b>${esc(cur.name)}</b></div><div class="thread">${(w.dms[cur.id]||[]).map(x=>`<div class="msg ${x.from===m.id?'me':''}">${esc(x.text)}</div>`).join('')||'<div class="empty">Say hi.</div>'}${typing[cur.id]?'<div class="msg typing">• • •</div>':''}</div><div class="row" style="padding:10px"><input id="dmin" placeholder="Message…" style="margin:0"><button class="btn sm" data-a="dmsend">Send</button></div></div>`}
 if(tab==='settings')return settingsView();
 if(tab==='profile'){const pc=C(profId);return pc?profileView(pc):''}
 if(tab==='event')return evView();
 if(tab==='alerts')return w.alerts.map(a=>`<div class="card">${esc(a)}</div>`).join('')||'<div class="empty">Nothing yet.</div>';
 if(tab==='school')return`<div class="card"><label>School name</label><input id="sn" value="${esc(w.school.name)}"><label>Description, rules, culture</label><textarea id="sd">${esc(w.school.desc)}</textarea><button class="btn" data-a="schoolsave">Save</button></div><div class="card"><b>Where everyone is</b>${w.chars.map(c=>`<div class="mute">${esc(c.name)}: ${c.loc||'—'}</div>`).join('')}</div>`;
 if(tab==='search')return`<input id="q" placeholder="Search people and posts"><div id="res"></div>`;
 if(tab==='cast')return editId?editor():`<button class="btn" data-a="addchar">Add character</button> <button class="btn alt" data-a="addpresets">Add preset students</button><br><br>${w.chars.map(c=>`<div class="card row">${av(c)}<div class="grow"><b>${esc(c.name)}</b>${c.id===m.id?' <span class="pill">you</span>':''}<div class="mute">@${esc(c.user)} · ${fmt(c.followers)} followers</div></div><button class="btn sm alt" data-a="edit" data-id="${c.id}">Edit</button></div>`).join('')}`}
const rels=['Strangers','Classmates','Friends','Close friends','Best friends','Childhood friends','Rivals','Enemies','Frenemies','Crush','Dating','Complicated'];
const feels=['Neutral','Likes me','Trusts me','Looks up to me','Protective of me','Has a crush on me','Jealous of me','Doesn\'t trust me','Dislikes me','Hates me','Conflicted'];
const sl=(k,l,v)=>`<label>${l}: <span id="o_${k}">${v}</span></label><input type="range" min="1" max="10" id="${k}" value="${v}" oninput="document.getElementById('o_${k}').textContent=this.value">`;
function editor(){const c=C(editId),isMe=c.id===wid&&false||c.id===W().meId,r=c.rel||{type:'Friends',myFeel:'Like them',theirFeel:'Likes me',close:5,trust:5,tension:2,romance:1,hist:''};
 const f=(k,l,t='input')=>`<label>${l}</label><${t} id="f_${k}" ${t==='input'?`value="${esc(c[k])}"`:''}>${t==='textarea'?esc(c[k]):''}${t==='textarea'?'</textarea>':''}`;
 return`<div class="card"><div class="banner" style="${c.banner?`background-image:url(${c.banner})`:''}"></div><div class="row">${av(c,'big')}<div class="grow"><b>${esc(c.name||'New character')}</b><div class="mute">Live preview · ${fmt(c.followers)} followers</div></div></div></div>
 <div class="card">${f('name','Name')}${f('user','Username')}${f('grade','Grade')}${f('pron','Pronouns')}${f('bio','Bio','textarea')}
 <label>Describe this character</label><textarea id="f_desc" style="min-height:160px" placeholder="Popular but quiet around strangers, sarcastic, my best friend since middle school…">${esc(c.desc)}</textarea>
 ${f('personality','Personality')}${f('speech','Speech style')}${f('interests','Interests & hobbies')}${f('secret','Secret','textarea')}
 <label>Followers</label><input type="number" id="f_followers" value="${c.followers}"><label>Following</label><input type="number" id="f_following" value="${c.following}">${sl('f_pop','Popularity',c.pop)}
 <label>Profile picture</label><input type="file" id="pf" accept=".jpg,.jpeg,.png,.webp,image/*"><label>Banner</label><input type="file" id="bf" accept="image/*"></div>
 ${isMe?'':`<div class="card"><b>Relationship with you</b><br><label>Relationship</label><select id="r_type">${rels.map(x=>`<option ${r.type===x?'selected':''}>${x}</option>`).join('')}</select><label>How do they feel about me?</label><select id="r_their">${feels.map(x=>`<option ${r.theirFeel===x?'selected':''}>${x}</option>`).join('')}</select><label>How do I feel about them?</label><input id="r_my" value="${esc(r.myFeel)}">${sl('r_close','Closeness',r.close)}${sl('r_trust','Trust',r.trust)}${sl('r_tension','Tension',r.tension)}${sl('r_romance','Romantic interest',r.romance)}<label>Describe your history together</label><textarea id="r_hist">${esc(r.hist)}</textarea></div>`}
 <button class="btn" data-a="savechar">Save</button> <button class="btn alt" data-a="back">Back</button> ${isMe?'':'<button class="btn alt" data-a="delchar">Delete</button>'}`}
// in-page dialog (prompt/confirm are blocked in many embedded viewers)
function ask(msg,def,cb){const o=document.createElement('div');o.style.cssText='position:fixed;inset:0;background:#0008;display:grid;place-items:center;z-index:99;padding:16px';
 o.innerHTML=`<div class="card" style="width:100%;max-width:380px"><b>${esc(msg)}</b>${def!==null?`<input id="askin" value="${esc(def)}">`:'<br><br>'}<button class="btn" id="askok">${def!==null?'Save':'Delete'}</button> <button class="btn alt" id="askno">Cancel</button></div>`;
 document.body.appendChild(o);const i=o.querySelector('#askin');i&&i.select();const go=()=>{const v=i?i.value.trim():true;if(!v)return;o.remove();cb(v)};
 o.querySelector('#askok').onclick=go;o.querySelector('#askno').onclick=()=>o.remove();i&&i.addEventListener('keydown',e=>{if(e.key==='Enter')go()})}
// ---- events
document.addEventListener('click',e=>{const t=e.target.closest('[data-a],[data-tab],[data-dm],[data-grp],[data-prof]');if(!t)return;const d=t.dataset,w=wid&&W();
 if(d.tab){tab=d.tab;editId=null;return render()}
 if(d.prof){if(editId)return;if(tab!=='profile')prevTab=tab;profId=d.prof;tab='profile';render();return}
 if(d.grp){grp=d.grp;dmWith=null;render();return}
 if(d.dm){dmWith=d.dm;grp=null;C(d.dm).unread=0;save();return render()}
 const a=d.a;
 if(a==='new')ask('Name your world','My High School',n=>{const x=mkWorld();x.name=n;db.worlds.push(x);save();wid=x.id;tab='cast';editId=x.meId;render()});
 if(a==='open'){wid=d.id;tab='feed';render();setTimeout(greet,2500)}if(a==='home'){wid=null;render()}
 if(a==='ren'){const x=db.worlds.find(v=>v.id===d.id);ask('Rename world',x.name,n=>{x.name=n;save();render()})}
 if(a==='dup'){const x=JSON.parse(JSON.stringify(db.worlds.find(v=>v.id===d.id)));x.id=uid();x.name+=' (copy)';db.worlds.push(x);save();render()}
 if(a==='del')ask('Delete this world permanently?',null,()=>{db.worlds=db.worlds.filter(v=>v.id!==d.id);save();render()});
 if(a==='wdismiss'){WHIDE=1;render(1)}
 if(a==='pback'){tab=prevTab;render()}
 if(a==='msg'){tab='dm';dmWith=d.id;grp=null;C(d.id).unread=0;save();render()}
 if(a==='pedit'){tab='cast';editId=d.id;render()}
 if(a==='evnew'){tab='event';evCur=null;render()}if(a==='evback'){evCur=null;render()}if(a==='evopen'){evCur=d.id;render()}
 if(a==='evstart'){const ids=[...document.querySelectorAll('.em:checked')].map(x=>x.value);if(!ids.length)return toast('Pick at least one person');if(!WE)return toast('The on-device AI is still loading. Try again in a moment.');const e={id:uid(),title:$('#evt').value.trim()||'a hangout',members:ids,log:[],opts:[],round:0,done:0};(w.events=w.events||[]).unshift(e);evCur=e.id;save();evStep(e,null);render()}
 const E=()=>(w.events||[]).find(x=>x.id===evCur);
 if(a==='evpick'){const e=E();if(e)evStep(e,e.opts[+d.i])}
 if(a==='evown'){const v=$('#evown').value.trim(),e=E();if(v&&e)evStep(e,v)}
 if(a==='gnew'){newGroup=true;render()}if(a==='gcancel'){newGroup=false;render()}if(a==='gback'){grp=null;render()}
 if(a==='gcreate'){const ids=[...document.querySelectorAll('.gm:checked')].map(x=>x.value);if(ids.length<2)return toast('Pick at least 2 members');const g={id:uid(),name:$('#gname').value.trim()||'Group chat',members:[...ids,w.meId],msgs:[]};(w.groups=w.groups||[]).unshift(g);grp=g.id;newGroup=false;save();render();if(WE)gReply(w,g,false)}
 if(a==='gsend'){const v=$('#gin').value.trim();if(v)gSend(grp,v)}
 if(a==='preset'){THEME={...PRE[d.id]};applyTheme();saveTheme();render()}
 if(a==='resetth'){THEME={};applyTheme();localStorage.removeItem('hallpass.theme');render()}
 if(a==='addpresets'){w.chars.push(...presetChars().filter(p=>!w.chars.some(c=>c.user===p.user)));save();render()}
 const P=()=>w.posts.find(p=>p.id===d.id);
 if(a==='like'){const p=P();p.lk=!p.lk;p.likes+=p.lk?1:-1;save();render()}
 if(a==='rt'){const p=P();p.rt=!p.rt;p.reposts+=p.rt?1:-1;save();render()}
 if(a==='reply'){replyTo=replyTo===d.id?null:d.id;render();const e=$('#rin');e&&e.focus()}
 if(a==='rsend'){const v=$('#rin').value.trim(),p=P();if(v){p.replies.push({by:w.meId,text:v});replyTo=null;answer(p,v);save();render()}}
 if(a==='post')command($('#cmd').value,true);if(a==='do')command($('#cmd').value,false);
 if(a==='dmback'){dmWith=null;render()}
 if(a==='dmsend'){const v=$('#dmin').value.trim();if(v)sendDM(dmWith,v)}
  if(a==='dmsend'){const v=$('#dmin').value.trim();if(v){(w.dms[dmWith]=w.dms[dmWith]||[]).push({from:w.meId,text:v});save();render()}}
 if(a==='schoolsave'){w.school.name=$('#sn').value;w.school.desc=$('#sd').value;save();render()}
 if(a==='addchar'){const c=newChar({name:'New student'});w.chars.push(c);editId=c.id;render()}
 if(a==='edit'){editId=d.id;render()}if(a==='back'){editId=null;render()}
 if(a==='delchar')ask('Delete this character?',null,()=>{w.chars=w.chars.filter(c=>c.id!==editId);editId=null;save();render()});
 if(a==='savechar')saveChar()});
function saveChar(){const c=C(editId);['name','user','grade','pron','bio','desc','personality','speech','interests','secret'].forEach(k=>c[k]=$('#f_'+k).value);
 c.user=(c.user||c.name).toLowerCase().replace(/\W/g,'');c.followers=+$('#f_followers').value||0;c.following=+$('#f_following').value||0;c.pop=+$('#f_pop').value;
 if($('#r_type'))c.rel={type:$('#r_type').value,theirFeel:$('#r_their').value,myFeel:$('#r_my').value,close:+$('#r_close').value,trust:+$('#r_trust').value,tension:+$('#r_tension').value,romance:+$('#r_romance').value,hist:$('#r_hist').value};
 const pf=$('#pf').files[0],bf=$('#bf').files[0],done=()=>{save();editId=null;render()};
 const doB=()=>bf?shrink(bf,900,u=>{c.banner=u;done()}):done();pf?shrink(pf,256,u=>{c.avatar=u;doB()}):doB()}
document.addEventListener('input',e=>{const th=e.target.dataset&&e.target.dataset.th;if(th){THEME[th]=th==='r'?+e.target.value:e.target.value;applyTheme();saveTheme();return}
 if(e.target.id==='q'){const q=e.target.value.toLowerCase(),w=W();$('#res').innerHTML=q?w.chars.filter(c=>(c.name+c.user).toLowerCase().includes(q)).map(c=>`<div class="card row">${av(c)}<b>${esc(c.name)}</b></div>`).join('')+w.posts.filter(p=>p.text.toLowerCase().includes(q)).map(postHTML).join(''):''}});
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||e.shiftKey)return;const b=e.target.id==='dmin'?'dmsend':e.target.id==='rin'?'rsend':e.target.id==='gin'?'gsend':0;if(b){e.preventDefault();document.querySelector('[data-a='+b+']').click()}});
applyTheme();setInterval(liveTick,18000);render();webInit();
</script></body></html>
